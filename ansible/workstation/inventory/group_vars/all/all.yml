# 클러스터 공통 (모든 노드)
# @see https://github.com/kubernetes-sigs/kubespray/blob/master/inventory/sample/group_vars/all/all.yml

ansible_user: "{{ lookup('env', 'WORKSTATION_BOOTSTRAP_USERNAME') }}"
ansible_ssh_private_key_file: "{{ lookup('env', 'WORKSTATION_SSH_PRIVATE_KEY_FILE_ABSOLUTE_PATH') }}"
ansible_become_password: "{{ lookup('env', 'WORKSTATION_BOOTSTRAP_PASSWORD') }}"

# NTP — Ubuntu 24.04+ 는 ntpsec (Kubespray docs/advanced/ntp.md)
ntp_enabled: true
ntp_package: ntpsec
ntp_timezone: 'Asia/Seoul'

# NVIDIA GPU — 노드별 host_vars (nvidia_enabled, nvidia_driver_package)
#   preConfigure    install-nvidia-driver + verify-nvidia-driver (수동 reboot 안내, 자동 reboot 없음)
#   postConfigure   install-nvidia-container-toolkit

# containerd 추가 runtime (Kubespray)
#   nvidia       post-configure toolkit → /usr/bin/nvidia-container-runtime
containerd_additional_runtimes:
  - name: nvidia
    type: 'io.containerd.runc.v2'
    options:
      BinaryName: /usr/bin/nvidia-container-runtime
      SystemdCgroup: 'true'
