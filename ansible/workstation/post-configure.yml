---
# Kubespray cluster 기동 후 호스트 마무리.
# 실행: pnpm ansible:postConfigure
#
# 선행: preConfigure — verify-nvidia-driver [OK] (nvidia-smi)
#
# 역할
#   install-nvidia-container-toolkit
#   configure-kata-containers   Kata config.d 드롭인 (--tags configure-kata-containers)

- name: Post-Configure Workstation
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: install-nvidia-container-toolkit
    - role: configure-kata-containers
      tags: [configure-kata-containers]
