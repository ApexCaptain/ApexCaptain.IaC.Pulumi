---
# Workstation 호스트 준비 (Kubespray cluster 전·병행).
# 실행: pnpm ansible:preConfigure
#
# 역할 순서
#   1. enable-iscsi           Longhorn iSCSI
#   2. longhorn-disks         Longhorn 디스크 (host_vars)
#   3. init-wol               Wake-on-LAN
#   4. network-carrier-loss   링크 끊김 시 IP 유지 (IgnoreCarrierLoss)
#   5. install-nvidia-driver  GPU driver staging (reboot 없음)
#   6. install-sysbox-runc    Sysbox CE (group_vars)
#   7. verify-nvidia-driver   nvidia-smi 확인 / 수동 reboot 안내 (reboot 없음)
#
# 4번만: pnpm ansible:preConfigure --tags network-carrier-loss
# 6번만: pnpm ansible:preConfigure --tags install-sysbox-runc

- name: Pre-Configure Workstation
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: enable-iscsi
    - role: longhorn-disks
    - role: init-wol
    - role: network-carrier-loss
      tags: [network-carrier-loss]
    - role: install-nvidia-driver
    - role: install-sysbox-runc
      tags: [install-sysbox-runc]
    - role: verify-nvidia-driver
